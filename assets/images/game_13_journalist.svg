<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="newsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="newsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#newsBg)"/>

  <!-- Top bar -->
  <rect x="60" y="24" width="1160" height="64" rx="16" fill="#1e293b" stroke="#334155" filter="url(#newsShadow)"/>
  <text x="100" y="65" font-family="'Prompt', sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">📰 นักข่าวฝึกหัด (Junior Journalist Studio)</text>
  <rect x="940" y="38" width="250" height="36" rx="18" fill="#e11d48" opacity="0.3"/>
  <text x="1065" y="62" font-family="'Prompt', sans-serif" font-size="16" font-weight="bold" fill="#fb7185" text-anchor="middle">🔴 ห้องตัดต่อข่าว ด่วน!</text>

  <!-- Left: Newspaper Layout preview -->
  <g transform="translate(80, 110)" filter="url(#newsShadow)">
    <rect width="640" height="560" rx="16" fill="#fdfbf7" stroke="#e2e8f0"/>
    <!-- Newspaper Masthead -->
    <rect x="30" y="25" width="580" height="60" rx="6" fill="#0f172a"/>
    <text x="320" y="62" font-family="'Prompt', serif" font-size="28" font-weight="bold" fill="#f8fafc" text-anchor="middle">หนังสือพิมพ์เยาวชนก้าวหน้า</text>
    <line x1="30" y1="95" x2="610" y2="95" stroke="#334155" stroke-width="2"/>
    
    <!-- Headline Slot (Droppable) -->
    <rect x="30" y="110" width="580" height="80" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="6 6"/>
    <text x="320" y="145" font-family="'Prompt', sans-serif" font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle">📌 วางพาดหัวข่าวที่นี่ (Headline)</text>
    <text x="320" y="172" font-family="'Prompt', sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">"นักเรียนไทยประดิษฐ์หุ่นยนต์คัดแยกขยะ คว้ารางวัลเหรียญทองระดับโลก"</text>

    <!-- News Body Columns -->
    <rect x="30" y="210" width="280" height="150" rx="8" fill="#e2e8f0"/>
    <text x="170" y="290" font-family="'Prompt', sans-serif" font-size="16" fill="#64748b" text-anchor="middle">📷 [รูปภาพประกอบข่าว]</text>

    <g transform="translate(325, 210)">
      <rect width="285" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="15" y="30" font-family="'Prompt', sans-serif" font-size="13" font-weight="bold" fill="#334155">เนื้อหาข่าว (Lead Paragraph):</text>
      <text x="15" y="60" font-family="'Prompt', sans-serif" font-size="12" fill="#64748b">เมื่อวานนี้ (Who) ทีมนักเรียนมัธยม (What)</text>
      <text x="15" y="85" font-family="'Prompt', sans-serif" font-size="12" fill="#64748b">ได้รับรางวัลชนะเลิศ (Where) ณ กรุงโตเกียว</text>
      <text x="15" y="110" font-family="'Prompt', sans-serif" font-size="12" fill="#64748b">(Why) จากการแก้ปัญหาสิ่งแวดล้อม</text>
      <text x="15" y="135" font-family="'Prompt', sans-serif" font-size="12" fill="#64748b">(How) ด้วยเทคโนโลยี AI อัจฉริยะ</text>
    </g>

    <!-- 5W1H Checker Checklist -->
    <rect x="30" y="380" width="580" height="150" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="50" y="410" font-family="'Prompt', sans-serif" font-size="16" font-weight="bold" fill="#166534">✓ ตรวจสอบองค์ประกอบ 5W1H:</text>
    <text x="50" y="440" font-family="'Prompt', sans-serif" font-size="14" fill="#15803d">✅ ใคร (Who): เด็กนักเรียนไทย</text>
    <text x="250" y="440" font-family="'Prompt', sans-serif" font-size="14" fill="#15803d">✅ ทำอะไร (What): สร้างหุ่นยนต์</text>
    <text x="440" y="440" font-family="'Prompt', sans-serif" font-size="14" fill="#15803d">✅ ที่ไหน (Where): โตเกียว</text>
    <text x="50" y="475" font-family="'Prompt', sans-serif" font-size="14" fill="#15803d">✅ เมื่อใด (When): สัปดาห์นี้</text>
    <text x="250" y="475" font-family="'Prompt', sans-serif" font-size="14" fill="#15803d">✅ ทำไม (Why): รักษาสิ่งแวดล้อม</text>
    <text x="440" y="475" font-family="'Prompt', sans-serif" font-size="14" fill="#15803d">✅ อย่างไร (How): ใช้ AI</text>
  </g>

  <!-- Right: 5W1H Word Building blocks & AI Editor Assistant -->
  <g transform="translate(750, 110)" filter="url(#newsShadow)">
    <rect width="470" height="560" rx="16" fill="#1e293b" stroke="#334155"/>
    <text x="30" y="45" font-family="'Prompt', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8">🤖 AI บรรณาธิการข่าว (Editor)</text>
    
    <!-- AI Feedback box -->
    <rect x="25" y="65" width="420" height="130" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="45" y="100" font-family="'Prompt', sans-serif" font-size="15" font-weight="bold" fill="#7dd3fc">คะแนนความดึงดูดของพาดหัว: 92/100</text>
    <text x="45" y="130" font-family="'Prompt', sans-serif" font-size="14" fill="#cbd5e1">💡 คำแนะนำ: พาดหัวกระชับ ชัดเจน มีกริยาสำคัญ</text>
    <text x="45" y="160" font-family="'Prompt', sans-serif" font-size="14" fill="#94a3b8">ควรระวัง: หลีกเลี่ยงภาษาลำลองในข่าวทางการ</text>

    <!-- Draggable components -->
    <text x="30" y="230" font-family="'Prompt', sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">เลือกชิ้นส่วนเรียงร้อยข้อความ:</text>
    
    <rect x="25" y="250" width="420" height="55" rx="10" fill="#334155"/>
    <text x="45" y="285" font-family="'Prompt', sans-serif" font-size="15" fill="#f8fafc">1. "จัดเต็ม! คว้ารางวัลใหญ่สุดปัง"</text>

    <rect x="25" y="320" width="420" height="55" rx="10" fill="#0369a1"/>
    <text x="45" y="355" font-family="'Prompt', sans-serif" font-size="15" fill="#f0f9ff">2. "นักเรียนไทยคว้าชัยระดับสากล"</text>

    <rect x="25" y="390" width="420" height="55" rx="10" fill="#334155"/>
    <text x="45" y="425" font-family="'Prompt', sans-serif" font-size="15" fill="#f8fafc">3. "เผยนวัตกรรมสุดเจ๋งระดับโลก"</text>

    <!-- Submit News Button -->
    <rect x="25" y="475" width="420" height="60" rx="14" fill="#0284c7"/>
    <text x="235" y="513" font-family="'Prompt', sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">🚀 ตีพิมพ์ข่าว (Publish Article)</text>
  </g>
</svg>
