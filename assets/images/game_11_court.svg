<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCourt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgCourt)"/>
  
  <!-- Courtroom Pillars -->
  <rect x="40" y="80" width="60" height="560" rx="8" fill="#4338ca" opacity="0.3"/>
  <rect x="140" y="80" width="60" height="560" rx="8" fill="#4338ca" opacity="0.3"/>
  <rect x="1080" y="80" width="60" height="560" rx="8" fill="#4338ca" opacity="0.3"/>
  <rect x="1180" y="80" width="60" height="560" rx="8" fill="#4338ca" opacity="0.3"/>

  <!-- Top Bar HUD -->
  <rect x="60" y="24" width="1160" height="64" rx="16" fill="#1e293b" opacity="0.9" filter="url(#shadow)"/>
  <text x="100" y="65" font-family="'Prompt', sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">⚖️ ศาลตัดสินภาษาไทย (Language Courtroom)</text>
  <rect x="860" y="38" width="160" height="36" rx="18" fill="#3b82f6" opacity="0.3"/>
  <text x="940" y="62" font-family="'Prompt', sans-serif" font-size="16" font-weight="bold" fill="#60a5fa" text-anchor="middle">คดีที่ 5 / 10</text>
  <rect x="1040" y="38" width="150" height="36" rx="18" fill="#f59e0b" opacity="0.3"/>
  <text x="1115" y="62" font-family="'Prompt', sans-serif" font-size="16" font-weight="bold" fill="#fbbf24" text-anchor="middle">⭐ 1,450 คะแนน</text>

  <!-- Scales of Justice Center Top -->
  <g transform="translate(640, 150)" filter="url(#shadow)">
    <!-- Scale base -->
    <rect x="-8" y="0" width="16" height="90" rx="4" fill="url(#goldGrad)"/>
    <rect x="-60" y="85" width="120" height="15" rx="5" fill="url(#goldGrad)"/>
    <!-- Beam -->
    <rect x="-140" y="-5" width="280" height="10" rx="5" fill="url(#goldGrad)"/>
    <!-- Pans -->
    <line x1="-120" y1="5" x2="-140" y2="40" stroke="#fcd34d" stroke-width="2"/>
    <line x1="-120" y1="5" x2="-100" y2="40" stroke="#fcd34d" stroke-width="2"/>
    <path d="M -160,40 Q -120,60 -80,40 Z" fill="url(#goldGrad)"/>

    <line x1="120" y1="5" x2="100" y2="40" stroke="#fcd34d" stroke-width="2"/>
    <line x1="120" y1="5" x2="140" y2="40" stroke="#fcd34d" stroke-width="2"/>
    <path d="M 80,40 Q 120,60 160,40 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Defendant Sentence Card -->
  <g transform="translate(240, 230)" filter="url(#shadow)">
    <rect width="800" height="230" rx="20" fill="url(#cardGrad)" stroke="#475569" stroke-width="2"/>
    <rect x="30" y="-16" width="180" height="34" rx="8" fill="#ef4444"/>
    <text x="120" y="7" font-family="'Prompt', sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">สำนวนฟ้องร้องคดี</text>
    <text x="40" y="70" font-family="'Prompt', sans-serif" font-size="28" font-weight="bold" fill="#f8fafc">
      "ทางโรงเรียนขอทำการประกาศเชิญชวนผู้ปกครองทุกท่าน"
    </text>
    <rect x="40" y="105" width="720" height="2" fill="#334155"/>
    <text x="40" y="145" font-family="'Prompt', sans-serif" font-size="18" fill="#94a3b8">
      คำแนะนำของพยาน: สังเกตการใช้คำว่า "ขอทำการประกาศ" มีความฟุ่มเฟือยหรือไม่?
    </text>
    <text x="40" y="185" font-family="'Prompt', sans-serif" font-size="16" fill="#cbd5e1">
      📌 ประเด็นกฎหมายภาษา: การใช้ภาษาทางการและคำซ้ำซ้อน
    </text>
  </g>

  <!-- Verdict Buttons (คำตัดสิน) -->
  <g transform="translate(240, 480)">
    <!-- Option A: ถูกต้อง -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="250" height="90" rx="16" fill="#065f46" stroke="#10b981" stroke-width="2"/>
      <text x="125" y="42" font-family="'Prompt', sans-serif" font-size="22" font-weight="bold" fill="#a7f3d0" text-anchor="middle">✓ ถูกต้องแล้ว</text>
      <text x="125" y="68" font-family="'Prompt', sans-serif" font-size="14" fill="#6ee7b7" text-anchor="middle">ภาษาสื่อสารสมบูรณ์</text>
    </g>

    <!-- Option B: ไม่ถูกต้อง (มีจุดผิด) -->
    <g transform="translate(275, 0)" filter="url(#shadow)">
      <rect width="250" height="90" rx="16" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
      <text x="125" y="42" font-family="'Prompt', sans-serif" font-size="22" font-weight="bold" fill="#fecaca" text-anchor="middle">✗ ไม่ถูกต้อง</text>
      <text x="125" y="68" font-family="'Prompt', sans-serif" font-size="14" fill="#fca5a5" text-anchor="middle">ผิดหลักไวยากรณ์</text>
    </g>

    <!-- Option C: ควรปรับปรุง (คำฟุ่มเฟือย) -->
    <g transform="translate(550, 0)" filter="url(#shadow)">
      <rect width="250" height="90" rx="16" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
      <text x="125" y="42" font-family="'Prompt', sans-serif" font-size="22" font-weight="bold" fill="#fde68a" text-anchor="middle">⚡ ควรปรับปรุง</text>
      <text x="125" y="68" font-family="'Prompt', sans-serif" font-size="14" fill="#fcd34d" text-anchor="middle">ฟุ่มเฟือย / ตัดทอนได้</text>
    </g>
  </g>

  <!-- Bottom AI Feedback Box -->
  <rect x="240" y="590" width="800" height="100" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="270" y="625" font-family="'Prompt', sans-serif" font-size="16" font-weight="bold" fill="#818cf8">
    🤖 คำวินิจฉัยศาล AI (Feedback):
  </text>
  <text x="270" y="655" font-family="'Prompt', sans-serif" font-size="15" fill="#e2e8f0">
    ควรปรับแก้เป็น "โรงเรียนขอประกาศเชิญชวน..." ตัดคำว่า "ทำการ" ออกเนื่องจากเป็นคำฟุ่มเฟือยตามหลักภาษาไทย
  </text>
</svg>
