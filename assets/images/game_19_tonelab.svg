<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#labBg)"/>

  <!-- Top Bar -->
  <rect x="60" y="24" width="1160" height="64" rx="16" fill="#134e4a" stroke="#14b8a6" stroke-width="2"/>
  <text x="100" y="65" font-family="'Prompt', sans-serif" font-size="24" font-weight="bold" fill="#ccfbf1">🧪 ห้องทดลองเสียงวรรณยุกต์ (Thai Tone Acoustic Lab)</text>
  <rect x="940" y="38" width="240" height="36" rx="18" fill="#0d9488" opacity="0.3"/>
  <text x="1060" y="62" font-family="'Prompt', sans-serif" font-size="16" font-weight="bold" fill="#5eead4" text-anchor="middle">🎙️ ระบบตรวจจับเสียง: พร้อม</text>

  <!-- Sound Wave Visualizer Box -->
  <g transform="translate(140, 115)">
    <rect width="1000" height="230" rx="20" fill="#042f2e" stroke="#0d9488" stroke-width="2"/>
    <text x="50" y="45" font-family="'Prompt', sans-serif" font-size="18" font-weight="bold" fill="#5eead4">📊 ภาพคลื่นเสียงแบบเรียลไทม์ (Pitch &amp; Frequency Spectrum)</text>
    
    <!-- Sound wave path -->
    <path d="M 60 140 Q 180 60 300 150 T 540 130 T 780 180 T 940 120" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round"/>
    <path d="M 60 140 Q 180 200 300 130 T 540 150 T 780 100 T 940 140" fill="none" stroke="#a7f3d0" stroke-width="2" opacity="0.6"/>

    <!-- Target Word Prompt -->
    <rect x="375" y="70" width="250" height="65" rx="14" fill="#115e59" stroke="#5eead4"/>
    <text x="500" y="113" font-family="'Prompt', sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">"ม้า"</text>

    <!-- Tone info -->
    <text x="500" y="185" font-family="'Prompt', sans-serif" font-size="18" fill="#ccfbf1" text-anchor="middle">
      รูปวรรณยุกต์โท แต่เป็น <tspan font-weight="bold" fill="#fde047">"เสียงตรี"</tspan> (อักษรต่ำ + สระเสียงยาว + ไม้โท)
    </text>

    <!-- Recording Controls -->
    <g transform="translate(425, 205)">
      <rect width="150" height="36" rx="18" fill="#f43f5e"/>
      <text x="75" y="24" font-family="'Prompt', sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">🎙️ กดออกเสียง</text>
    </g>
  </g>

  <!-- 5 Tone Pitch Tubes (หลอดทดลอง 5 เสียงวรรณยุกต์) -->
  <g transform="translate(140, 375)">
    <!-- Tone 1: สามัญ -->
    <g transform="translate(0, 0)">
      <rect width="180" height="290" rx="18" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
      <rect x="20" y="20" width="140" height="50" rx="10" fill="#0f766e"/>
      <text x="90" y="52" font-family="'Prompt', sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">เสียงสามัญ</text>
      <circle cx="90" cy="120" r="30" fill="#0d9488" opacity="0.3"/>
      <text x="90" y="128" font-size="24" fill="#5eead4" text-anchor="middle">-</text>
      <text x="90" y="180" font-family="'Prompt', sans-serif" font-size="22" font-weight="bold" fill="#ccfbf1" text-anchor="middle">มา</text>
      <rect x="30" y="225" width="120" height="36" rx="18" fill="#14b8a6"/>
      <text x="90" y="248" font-family="'Prompt', sans-serif" font-size="14" font-weight="bold" fill="#042f2e" text-anchor="middle">ฟังตัวอย่าง</text>
    </g>

    <!-- Tone 2: เอก -->
    <g transform="translate(205, 0)">
      <rect width="180" height="290" rx="18" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
      <rect x="20" y="20" width="140" height="50" rx="10" fill="#0f766e"/>
      <text x="90" y="52" font-family="'Prompt', sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">เสียงเอก</text>
      <circle cx="90" cy="120" r="30" fill="#0d9488" opacity="0.3"/>
      <text x="90" y="128" font-size="24" fill="#5eead4" text-anchor="middle">&#x2198;</text>
      <text x="90" y="180" font-family="'Prompt', sans-serif" font-size="22" font-weight="bold" fill="#ccfbf1" text-anchor="middle">หม่า</text>
      <rect x="30" y="225" width="120" height="36" rx="18" fill="#14b8a6"/>
      <text x="90" y="248" font-family="'Prompt', sans-serif" font-size="14" font-weight="bold" fill="#042f2e" text-anchor="middle">ฟังตัวอย่าง</text>
    </g>

    <!-- Tone 3: โท -->
    <g transform="translate(410, 0)">
      <rect width="180" height="290" rx="18" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
      <rect x="20" y="20" width="140" height="50" rx="10" fill="#0f766e"/>
      <text x="90" y="52" font-family="'Prompt', sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">เสียงโท</text>
      <circle cx="90" cy="120" r="30" fill="#0d9488" opacity="0.3"/>
      <text x="90" y="128" font-size="24" fill="#5eead4" text-anchor="middle">&#x2227;</text>
      <text x="90" y="180" font-family="'Prompt', sans-serif" font-size="22" font-weight="bold" fill="#ccfbf1" text-anchor="middle">ม่า / หน้า</text>
      <rect x="30" y="225" width="120" height="36" rx="18" fill="#14b8a6"/>
      <text x="90" y="248" font-family="'Prompt', sans-serif" font-size="14" font-weight="bold" fill="#042f2e" text-anchor="middle">ฟังตัวอย่าง</text>
    </g>

    <!-- Tone 4: ตรี (Target Highlighted) -->
    <g transform="translate(615, 0)">
      <rect width="180" height="290" rx="18" fill="#0f766e" stroke="#fde047" stroke-width="3"/>
      <rect x="20" y="20" width="140" height="50" rx="10" fill="#f59e0b"/>
      <text x="90" y="52" font-family="'Prompt', sans-serif" font-size="20" font-weight="bold" fill="#78350f" text-anchor="middle">เสียงตรี &#x2605;</text>
      <circle cx="90" cy="120" r="30" fill="#fde047" opacity="0.3"/>
      <text x="90" y="128" font-size="24" fill="#fde047" text-anchor="middle">&#x2197;</text>
      <text x="90" y="180" font-family="'Prompt', sans-serif" font-size="26" font-weight="bold" fill="#fde047" text-anchor="middle">ม้า &#x2713;</text>
      <rect x="30" y="225" width="120" height="36" rx="18" fill="#f59e0b"/>
      <text x="90" y="248" font-family="'Prompt', sans-serif" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">ตรงกับโจทย์!</text>
    </g>

    <!-- Tone 5: จัตวา -->
    <g transform="translate(820, 0)">
      <rect width="180" height="290" rx="18" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
      <rect x="20" y="20" width="140" height="50" rx="10" fill="#0f766e"/>
      <text x="90" y="52" font-family="'Prompt', sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">เสียงจัตวา</text>
      <circle cx="90" cy="120" r="30" fill="#0d9488" opacity="0.3"/>
      <text x="90" y="128" font-size="24" fill="#5eead4" text-anchor="middle">&#x2228;</text>
      <text x="90" y="180" font-family="'Prompt', sans-serif" font-size="22" font-weight="bold" fill="#ccfbf1" text-anchor="middle">หมา</text>
      <rect x="30" y="225" width="120" height="36" rx="18" fill="#14b8a6"/>
      <text x="90" y="248" font-family="'Prompt', sans-serif" font-size="14" font-weight="bold" fill="#042f2e" text-anchor="middle">ฟังตัวอย่าง</text>
    </g>
  </g>
</svg>
